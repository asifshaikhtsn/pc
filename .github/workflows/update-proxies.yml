name: Update proxy lists

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      max_checks:
        description: "Maximum protocol checks in this run"
        required: false
        default: "1800"

permissions:
  contents: write

concurrency:
  group: proxy-list-updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      MAX_CHECKS_PER_RUN: ${{ inputs.max_checks || '1800' }}
      CHECK_CONCURRENCY: "120"
      CHECK_TIMEOUT_SECONDS: "6"
      ELITE_CHECKS_PER_RUN: "100"
      ELITE_CONCURRENCY: "15"
      WORKING_RECHECK_MINUTES: "30"
      DEAD_RECHECK_MINUTES: "360"
      PRUNE_AFTER_DAYS: "3"
      ACTIVE_SOURCE_WINDOW_MINUTES: "60"
      MAX_WORKING_AGE_MINUTES: "360"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Temporary debugging step
      - name: Debug proxy source counts
        shell: bash
        run: |
          set -u

          debug_source() {
            NAME="$1"
            URL="$2"

            RAW_FILE="${NAME}_raw.txt"
            PARSED_FILE="${NAME}_parsed.txt"

            : > "$RAW_FILE"
            : > "$PARSED_FILE"

            if HTTP_CODE=$(curl \
              --location \
              --silent \
              --show-error \
              --retry 3 \
              --connect-timeout 15 \
              --max-time 60 \
              --user-agent "Mozilla/5.0" \
              --write-out "%{http_code}" \
              --output "$RAW_FILE" \
              "$URL"); then
              CURL_STATUS="success"
            else
              CURL_STATUS="failed"
            fi

            grep -Eo \
              '([0-9]{1,3}\.){3}[0-9]{1,3}:[0-9]{1,5}' \
              "$RAW_FILE" |
              sort -u > "$PARSED_FILE" || true

            echo "========================================"
            echo "Source: $NAME"
            echo "URL: $URL"
            echo "Curl status: $CURL_STATUS"
            echo "HTTP status: $HTTP_CODE"
            echo "Downloaded bytes: $(wc -c < "$RAW_FILE")"
            echo "Downloaded lines: $(wc -l < "$RAW_FILE")"
            echo "Parsed unique proxies: $(wc -l < "$PARSED_FILE")"
          }

          # In dono URLs ko apni actual raw proxy URLs se replace karo.
          debug_source \
            "source_1" \
            "PAHLI_RAW_PROXY_URL"

          debug_source \
            "source_2" \
            "DUSRI_RAW_PROXY_URL"

          cat source_1_parsed.txt source_2_parsed.txt \
            > debug_combined_proxies.txt

          sort -u debug_combined_proxies.txt \
            > debug_unique_proxies.txt

          echo "========================================"
          echo "Combined before dedupe: $(wc -l < debug_combined_proxies.txt)"
          echo "Combined unique endpoints: $(wc -l < debug_unique_proxies.txt)"

      - name: Build weekly GeoLite cache key
        id: geolite-key
        shell: bash
        run: |
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore GeoLite country database
        id: geolite-cache
        uses: actions/cache@v5
        with:
          path: data/GeoLite2-Country.mmdb
          key: geolite-country-${{ steps.geolite-key.outputs.week }}

      - name: Download GeoLite country database
        if: steps.geolite-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p data

          curl \
            --fail \
            --location \
            --retry 3 \
            "https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb" \
            --output data/GeoLite2-Country.mmdb

      - name: Scrape, validate, and organize
        run: python -m proxy_pipeline --root .

      - name: Commit changed data
        shell: bash
        run: |
          git config user.name "pcpehle-updater[bot]"
          git config user.email "pcpehle-updater@users.noreply.github.com"

          git add proxies raw stats state

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "chore: update proxy lists [skip ci]"
          git push
